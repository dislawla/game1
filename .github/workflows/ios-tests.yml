name: iOS Tests

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ios-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test on ${{ matrix.device }}
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        # Разные размеры экрана нарочно — сетка карточек (CollectionGridView)
        # и детальный вид (Card3DDetailView) считают отступы/размеры от
        # реальной ширины экрана, и именно расхождения между iPhone SE и
        # Pro Max были источником багов в этом проекте раньше.
        device:
          - "iPhone SE (3rd generation)"
          - "iPhone 15"
          - "iPhone 15 Pro Max"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode & simulator versions
        run: |
          xcodebuild -version
          xcrun simctl list devices available

      - name: Build and test
        run: |
          set -o pipefail
          xcodebuild test \
            -project game1.xcodeproj \
            -scheme game1 \
            -destination "platform=iOS Simulator,name=${{ matrix.device }},OS=latest" \
            -resultBundlePath TestResults.xcresult

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.device }}
          path: TestResults.xcresult
